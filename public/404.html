<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sivua ei löytynyt | Seniorin aloitussivu</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f5f1e8;
        color: #1d2a33;
      }

      main {
        width: min(34rem, calc(100% - 3rem));
        padding: 2rem;
        border: 2px solid #1d2a33;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 0.75rem 2rem rgb(29 42 51 / 12%);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
      }

      p {
        font-size: 1.125rem;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1rem;
        border-radius: 0.6rem;
        background: #173f5f;
        color: #fff;
        font-weight: 700;
      }

      a:focus-visible {
        outline: 4px solid #f3b61f;
        outline-offset: 4px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #10181e;
          color: #f7f3ea;
        }

        main {
          border-color: #f7f3ea;
          background: #17242d;
        }

        a {
          background: #f3b61f;
          color: #17242d;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Virhe 404</p>
      <h1>Sivua ei löytynyt</h1>
      <p>Osoite voi olla vanhentunut tai siinä voi olla kirjoitusvirhe.</p>
      <a href="./">Palaa Seniorin aloitussivulle</a>
    </main>
  </body>
</html>
